name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            npm: darwin-arm64
            binary: sshtty
          - os: macos-latest
            target: x86_64-apple-darwin
            npm: darwin-x64
            binary: sshtty
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            npm: linux-x64
            binary: sshtty
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            npm: linux-arm64
            binary: sshtty
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            npm: win32-x64
            binary: sshtty.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.npm }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf sshtty-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release ${{ matrix.binary }}
          gh release upload "${{ github.event.release.tag_name }}" sshtty-${{ matrix.target }}.tar.gz --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest version-patch
      - run: node scripts/build-npm.mts
      - run: version-patch node "${{ github.event.release.tag_name }}" --prefix v --pkg-file dist/npm/package.json

      - uses: actions/download-artifact@v4
        with:
          path: dist/npm/bin
      - run: chmod +x dist/npm/bin/*/sshtty

      - run: npm publish --access public --tag ${{ github.event.release.prerelease && 'next' || 'latest' }}
        working-directory: dist/npm
