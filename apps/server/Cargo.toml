[package]
name = "ttysh"
version = "0.0.0"
edition = "2024"
description = "Browser terminal with groups and tabs that keeps your shells running"
license = "MIT"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
futures-util = "0.3.34"
portable-pty = "0.9.0"
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"
