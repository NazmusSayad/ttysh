[package]
name = "ttysh"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
dirs = "7.0.0"
futures-util = "0.3.34"
portable-pty = "0.9.0"
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
